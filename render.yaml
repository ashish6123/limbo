services:
  - type: web
    name: limbo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_MODE
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ORDER_FULFILLABLE_WINDOW_MINUTES
        value: "30"
      - key: REFUND_SETTLEMENT_SLA_HOURS
        value: "72"
      - key: MAX_AUTO_AMOUNT_PAISE
        value: "500000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: CIRCUIT_BREAKER_FALSE_INTERVENTION_RATE
        value: "0.02"
      - key: DRY_RUN
        value: "true"
      - key: BASELINE_RESOLUTION_DAYS
        value: "21"
      - key: RECON_INTERVAL_SECONDS
        value: "60"
      - key: RUN_EMBEDDED_SCHEDULER
        value: "true"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
      - key: DEMO_ORDER_AMOUNT_PAISE
        value: "100000"
      - key: DEMO_MAX_AMOUNT_PAISE
        value: "100000"
      - key: DEMO_SESSION_TTL_MINUTES
        value: "30"
      - key: DEMO_FULFILLABLE_WINDOW_SECONDS
        value: "20"
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: "10"

# No separate worker service: Render's free plan doesn't offer Background
# Workers (paid plans only). RUN_EMBEDDED_SCHEDULER=true above runs the
# reconciliation loop inside limbo-api instead — the same code path local
# docker-compose dev already uses (see app/main.py). If a Background Worker
# becomes available on your plan later, set RUN_EMBEDDED_SCHEDULER=false here
# and add a `type: worker` service running `python -m app.worker` — see the
# git history of this file for the exact block to restore.
