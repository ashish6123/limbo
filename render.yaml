services:
  - type: web
    name: limbo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_MODE
        value: paypal
      # PayPal sandbox app credentials (developer.paypal.com > Apps & Credentials, Sandbox).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook id from the sandbox app's Webhooks section, pointed at
      # https://<limbo-api host>/webhooks/paypal. Leave blank to disable the receiver.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PUBLIC_DASHBOARD_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ORDER_FULFILLABLE_WINDOW_MINUTES
        value: "30"
      - key: REFUND_SETTLEMENT_SLA_HOURS
        value: "72"
      # All *_PAISE settings are integer minor units: cents in PayPal/USD mode.
      - key: MAX_AUTO_AMOUNT_PAISE
        value: "50000"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
      - key: CIRCUIT_BREAKER_FALSE_INTERVENTION_RATE
        value: "0.02"
      - key: DRY_RUN
        value: "true"
      - key: BASELINE_RESOLUTION_DAYS
        value: "21"
      - key: RECON_INTERVAL_SECONDS
        value: "60"
      - key: RUN_EMBEDDED_SCHEDULER
        value: "true"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
      - key: DEMO_ORDER_AMOUNT_PAISE
        value: "1000"
      - key: DEMO_MAX_AMOUNT_PAISE
        value: "1000"
      - key: DEMO_SESSION_TTL_MINUTES
        value: "30"
      - key: DEMO_FULFILLABLE_WINDOW_SECONDS
        value: "20"
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: "10"

  - type: web
    name: limbo-dashboard
    runtime: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    plan: free
    envVars:
      # Baked into the Next.js build: the public URL of limbo-api, e.g. https://limbo-api.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_DASHBOARD_API_KEY
        sync: false

# No separate worker service: Render's free plan doesn't offer Background
# Workers (paid plans only). RUN_EMBEDDED_SCHEDULER=true above runs the
# reconciliation loop inside limbo-api instead — the same code path local
# docker-compose dev already uses (see app/main.py). If a Background Worker
# becomes available on your plan later, set RUN_EMBEDDED_SCHEDULER=false here
# and add a `type: worker` service running `python -m app.worker` — see the
# git history of this file for the exact block to restore.
